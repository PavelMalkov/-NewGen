version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: streaming_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: streaming_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - streaming_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streaming_backend
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/streaming_db
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      PORT: 5000
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - streaming_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: streaming_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - streaming_network

volumes:
  postgres_data:

networks:
  streaming_network:
    driver: bridge
